<title>drinks</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one centered column (max 720px), sticky top bar with tabs; cards for drinks, tiles for stats. */
:root {
  --bg: #faf7f2;
  --surface: #ffffff;
  --surface-2: #f3eee6;
  --border: #e7e0d4;
  --text: #1c1917;
  --muted: #78716c;
  --accent: #d97706;
  --accent-strong: #b45309;
  --accent-soft: #fef3c7;
  --on-accent: #ffffff;
  --danger: #dc2626;
  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12100e; --surface: #1c1917; --surface-2: #26221f; --border: #36302b;
    --text: #f5f5f4; --muted: #a8a29e; --accent: #f59e0b; --accent-strong: #fbbf24;
    --accent-soft: #3a2a10; --on-accent: #1c1917; --danger: #f87171; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12100e; --surface: #1c1917; --surface-2: #26221f; --border: #36302b;
  --text: #f5f5f4; --muted: #a8a29e; --accent: #f59e0b; --accent-strong: #fbbf24;
  --accent-soft: #3a2a10; --on-accent: #1c1917; --danger: #f87171; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--surface-2); border-radius: 12px; padding: 3px; }
.seg button { border: 0; background: none; border-radius: 10px; padding: 8px; font-weight: 600; color: var(--muted); cursor: pointer; }
.seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }
details.more > summary { list-style: none; cursor: pointer; }
details.more > summary::-webkit-details-marker { display: none; }
details.more[open] .edit-hint { display: none; }
body { background: var(--bg); color: var(--text); font: 15px/1.45 var(--font); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); }
.wrap { max-width: 720px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar { display: flex; align-items: center; gap: 10px; height: 54px; }
.brand { font-weight: 800; font-size: 18px; letter-spacing: -0.02em; text-decoration: none; }
.demo-pill { font-size: 11px; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--accent-strong); background: var(--accent-soft); border-radius: 999px; padding: 2px 8px; }
.spacer { flex: 1; }
.tabs { display: flex; gap: 4px; overflow-x: auto; padding-block: 0 8px; scrollbar-width: none; }
.tab { border: 0; background: none; border-radius: 999px; padding: 5px 12px; font-size: 14px; color: var(--muted); cursor: pointer; white-space: nowrap; text-decoration: none; }
.tab:hover { color: var(--text); }
.tab.on { background: var(--accent-soft); color: var(--accent-strong); font-weight: 600; }
main { padding-block: 20px 60px; }

.card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 14px; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.grow { flex: 1; min-width: 0; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.tiny { font-size: 11px; }
.trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
h1 { font-size: 24px; letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
h2 { font-size: 16px; margin: 0; }
.num { font-variant-numeric: tabular-nums; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; flex-shrink: 0; border: 1px solid var(--border); background: var(--surface); border-radius: 12px; padding: 8px 14px; font-size: 14px; font-weight: 500; cursor: pointer; text-decoration: none; }
.btn:hover { background: var(--surface-2); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: transparent; color: var(--on-accent); }
.btn.primary:hover { background: var(--accent-strong); }
.btn.big { padding: 12px 18px; font-size: 16px; }
.btn.sm { padding: 5px 10px; font-size: 13px; }
.btn.danger { color: var(--danger); }
.input { width: 100%; border: 1px solid var(--border); background: var(--surface); border-radius: 12px; padding: 9px 12px; }
.input:focus { border-color: var(--accent); outline: none; }
label.lbl, .lbl { display: block; font-size: 13px; font-weight: 500; color: var(--muted); margin-bottom: 4px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 480px) { .grid2.stack-sm { grid-template-columns: 1fr; } }

.avatar { width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; object-fit: cover; background: var(--surface-2); }
.avatar.s { width: 32px; height: 32px; }
.avatar.l { width: 72px; height: 72px; }
.link { background: none; border: 0; padding: 0; cursor: pointer; font-weight: 600; text-align: left; }
.link:hover { text-decoration: underline; }

.drink-icon { width: 48px; height: 48px; border-radius: 12px; background: var(--surface-2); display: grid; place-items: center; font-size: 26px; flex-shrink: 0; }
.std { text-align: right; }
.std b { display: block; font-size: 20px; }
.photo { width: 100%; max-height: 380px; object-fit: cover; border-radius: 12px; display: block; }
.chip { display: inline-flex; align-items: center; gap: 4px; border: 0; background: none; border-radius: 999px; padding: 4px 10px; font-size: 13px; color: var(--muted); cursor: pointer; }
.chip:hover { color: var(--text); background: var(--surface-2); }
.chip.on { background: var(--accent-soft); color: var(--accent-strong); font-weight: 600; }
.comment { display: flex; gap: 8px; }
.bubble { background: var(--surface-2); border-radius: 14px; padding: 6px 10px; min-width: 0; flex: 1; overflow-wrap: anywhere; }

.types { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.type { display: flex; flex-direction: column; align-items: center; gap: 2px; border: 1px solid var(--border); background: var(--surface); border-radius: 12px; padding: 8px 4px; font-size: 12px; cursor: pointer; }
.type span { font-size: 24px; }
.type.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent-strong); font-weight: 600; }
.scan { background: color-mix(in srgb, var(--accent-soft) 55%, var(--surface)); }
.stepper { display: flex; align-items: center; gap: 8px; }
.stepper .btn { width: 36px; height: 36px; padding: 0; }

.tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
@media (max-width: 480px) { .tiles.six { grid-template-columns: repeat(2, 1fr); } }
.tile .v { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.chart { position: relative; height: 140px; margin-top: 8px; }
.gridline { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--border); }
.bars { position: absolute; inset: 0; display: flex; align-items: flex-end; gap: 2px; }
.barhit { flex: 1; height: 100%; display: flex; align-items: flex-end; background: none; border: 0; padding: 0; cursor: pointer; }
.barhit span { display: block; width: 100%; background: var(--accent); border-radius: 4px 4px 0 0; }
.barhit:hover span, .barhit.on span { background: var(--accent-strong); }
.hbar { height: 10px; border-radius: 0 4px 4px 0; background: var(--accent); }
.hbar-track { background: var(--surface-2); border-radius: 0 4px 4px 0; }
.typerow { display: grid; grid-template-columns: 7.5rem 1fr 3rem; align-items: center; gap: 8px; font-size: 14px; }

.rank { width: 28px; text-align: center; font-weight: 700; color: var(--muted); font-variant-numeric: tabular-nums; }
.me-row { border-color: var(--accent); }
.notice { border-radius: 12px; padding: 10px 12px; background: var(--accent-soft); color: var(--accent-strong); font-size: 14px; }
.empty { text-align: center; padding: 36px 16px; }
.empty .big { font-size: 40px; }
.err { color: var(--danger); font-size: 14px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header class="top">
  <div class="wrap">
    <div class="bar">
      <a class="brand" href="#feed">🍻 drinks</a>
      <span class="demo-pill">Demo</span>
      <span class="spacer"></span>
      <a class="btn primary sm" href="#log" id="logBtn">+ Log</a>
    </div>
    <nav class="tabs" id="tabs" aria-label="Sections"></nav>
  </div>
</header>
<main class="wrap" id="app" aria-live="polite"></main>

<script>
"use strict";

// ---------------------------------------------------------------- constants
const TYPES = [
  { type: "beer", label: "Beer", emoji: "🍺", ml: 355, abv: 5 },
  { type: "wine", label: "Wine", emoji: "🍷", ml: 150, abv: 12 },
  { type: "cocktail", label: "Cocktail", emoji: "🍸", ml: 120, abv: 15 },
  { type: "shot", label: "Shot", emoji: "🥃", ml: 44, abv: 40 },
  { type: "spirit", label: "Mixed", emoji: "🥂", ml: 250, abv: 7 },
  { type: "cider", label: "Cider", emoji: "🍏", ml: 355, abv: 5 },
  { type: "seltzer", label: "Seltzer", emoji: "🫧", ml: 355, abv: 5 },
  { type: "other", label: "Other", emoji: "🍹", ml: 250, abv: 5 },
];
const SIZES = [["Shot 44 ml", 44], ["Wine 150 ml", 150], ["Bottle 330 ml", 330], ["Can 12 oz", 355], ["US pint", 473], ["UK pint", 568]];
const PERIODS = [["today", "Today"], ["week", "This week"], ["month", "This month"], ["all", "All time"]];
const ROUTES = ["feed", "log", "leaderboard", "groups", "me", "person", "group"];
const TABS = [["feed", "Feed"], ["leaderboard", "Leaderboard"], ["groups", "Groups"], ["me", "My stats"]];
const MAX_DRINKS_PER_PERSON = 1500;
const DAY = 864e5;

const meta = (t) => TYPES.find((x) => x.type === t) || TYPES[7];
const stdOf = (ml, abv) => Math.round((ml * abv / 100) * 0.789 / 14 * 100) / 100;
const fmtStd = (n) => { const v = Number(n) || 0; return v.toFixed(v >= 10 ? 0 : 1); };
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const rid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
function timeAgo(ms) {
  const d = (Date.now() - ms) / 1000;
  if (d < 60) return "just now";
  if (d < 3600) return Math.floor(d / 60) + "m ago";
  if (d < 86400) return Math.floor(d / 3600) + "h ago";
  if (d < 604800) return Math.floor(d / 86400) + "d ago";
  return new Date(ms).toLocaleDateString(undefined, { month: "short", day: "numeric" });
}
function localInputNow() {
  const d = new Date(); d.setSeconds(0, 0);
  return new Date(d.getTime() - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 16);
}
const startOfDay = (ms) => { const d = new Date(ms); d.setHours(0, 0, 0, 0); return d.getTime(); };
const dayKey = (ms) => { const d = new Date(ms); return d.getFullYear() + "-" + d.getMonth() + "-" + d.getDate(); };

// ---------------------------------------------------------------- state
const S = {
  route: "feed", person: null, group: null,
  uid: null, canWrite: false, status: "loading", // loading | ready | nodb | offline
  dbError: null, slow: false, loaded: false,
  drinks: {}, cheers: {}, comments: {}, groups: {}, members: {},
  friends: {}, prof: {}, feedLimit: 30, period: "week", boardScope: "friends", boardType: "all", openComments: new Set(),
  hover: null, confirmDelete: null, toast: "",
  log: null,
};
let db = null, user = null, sample = null, assets = null, imageScan = false;

function freshLog() {
  return { type: "beer", name: "", ml: "355", abv: "5", qty: 1, when: "", open: false, group: S.group && isMember(S.group) ? S.group : "", notes: "",
    photo: null, photoUrl: null, scanning: false, scan: null, picked: 0, error: "", saving: false };
}

// ---------------------------------------------------------------- derived data
function allDrinks() {
  const out = [];
  for (const [uid, items] of Object.entries(S.drinks)) for (const d of items) out.push({ ...d, uid, key: uid + "/" + d.id });
  return out.sort((a, b) => b.at - a.at);
}
function cheerIndex() {
  const count = {}, mine = new Set(S.cheers[S.uid] || []);
  for (const keys of Object.values(S.cheers)) for (const k of keys) count[k] = (count[k] || 0) + 1;
  return { count, mine };
}
function commentIndex() {
  const by = {};
  for (const [uid, items] of Object.entries(S.comments)) for (const c of items) (by[c.k] ||= []).push({ ...c, uid });
  for (const k in by) by[k].sort((a, b) => a.at - b.at);
  return by;
}
const myGroups = () => S.members[S.uid] || [];
const myFriends = () => S.friends[S.uid] || [];
const isMember = (gid) => myGroups().includes(gid);
function groupMembers(gid) { return Object.entries(S.members).filter(([, g]) => g.includes(gid)).map(([u]) => u); }
function nameOf(uid) { return (S.prof[uid] && S.prof[uid].name) || (uid === S.uid ? "You" : "Someone"); }
function avatarOf(uid) { return S.prof[uid]?.avatarUrl || ""; }
function leaderboard(filter) {
  const rows = {};
  for (const d of allDrinks()) if (filter(d)) {
    const r = (rows[d.uid] ||= { uid: d.uid, count: 0, std: 0 });
    r.count++; r.std += d.std;
  }
  return Object.values(rows).sort((a, b) => b.std - a.std || b.count - a.count);
}

// ---------------------------------------------------------------- platform
async function boot() {
  route();
  const c = window.claude;
  if (!c || typeof c.use !== "function") { S.status = "offline"; render(); return; }
  [user, db, sample, assets] = await Promise.all(["user", "db", "sample", "assets"].map((n) => c.use(n).catch(() => null)));
  if (user) {
    S.uid = await Promise.resolve(user.id()).catch(() => null);
    let w = null;
    try { w = await Promise.resolve(user.can("data.write")); } catch { w = null; }
    S.canWrite = !!S.uid && w !== false;
  }
  if (sample) { const lim = await sample.limits().catch(() => null); imageScan = !!lim?.images; }
  if (!db) { S.status = "nodb"; render(); return; }
  S.status = "ready";
  const slow = setTimeout(() => { S.slow = true; render(); }, 10000);
  const done = () => { clearTimeout(slow); if (S.slow) { S.slow = false; } };
  const sub = (col, apply) => db.collection(col).onSnapshot((snap) => {
    apply(snap);
    if (!snap.metadata.fromCache) done();
    loadProfiles();
    scheduleRender();
  }, (e) => { done(); S.dbError = e.code; scheduleRender(); });
  sub("drinks", (s) => { S.loaded = true; const o = {}; s.docs.forEach((d) => { o[d.id] = Array.isArray(d.data().items) ? d.data().items : []; }); if (pendingMine.drinks) o[S.uid] = pendingMine.drinks; S.drinks = o; });
  sub("cheers", (s) => { const o = {}; s.docs.forEach((d) => { o[d.id] = Array.isArray(d.data().keys) ? d.data().keys : []; }); if (pendingMine.cheers) o[S.uid] = pendingMine.cheers; S.cheers = o; });
  sub("comments", (s) => { const o = {}; s.docs.forEach((d) => { o[d.id] = Array.isArray(d.data().items) ? d.data().items : []; }); if (pendingMine.comments) o[S.uid] = pendingMine.comments; S.comments = o; });
  sub("memberships", (s) => { const o = {}; s.docs.forEach((d) => { o[d.id] = Array.isArray(d.data().groups) ? d.data().groups : []; }); if (pendingMine.memberships) o[S.uid] = pendingMine.memberships; S.members = o; });
  sub("friends", (s) => { const o = {}; s.docs.forEach((d) => { o[d.id] = Array.isArray(d.data().uids) ? d.data().uids : []; }); if (pendingMine.friends) o[S.uid] = pendingMine.friends; S.friends = o; });
  sub("groups", (s) => { const o = {}; s.docs.forEach((d) => { o[d.id] = d.data(); }); S.groups = o; });
  render();
}

let profileBusy = false;
async function loadProfiles() {
  if (!user || profileBusy) return;
  const ids = new Set([S.uid, ...Object.keys(S.drinks), ...Object.keys(S.members), ...Object.keys(S.comments), ...myFriends()].filter(Boolean));
  const missing = [...ids].filter((id) => !S.prof[id]);
  if (!missing.length) return;
  profileBusy = true;
  try {
    const ps = await user.profiles(missing);
    for (const id of missing) if (ps && ps[id]) S.prof[id] = ps[id];
    scheduleRender();
  } catch { /* names fall back to "Someone" */ }
  profileBusy = false;
}

// Writes: one at a time per document; my own docs are mirrored locally right away.
const pendingMine = {};
const queues = {};
function saveMine(col, field, value) {
  pendingMine[col] = value;
  const path = col + "/" + S.uid;
  const run = () => db.doc(path).set({ [field]: value, updatedAt: Date.now() });
  const p = (queues[path] || Promise.resolve()).catch(() => {}).then(run);
  queues[path] = p;
  return p.then(() => { if (pendingMine[col] === value) delete pendingMine[col]; }, (e) => {
    if (pendingMine[col] === value) delete pendingMine[col];
    if (e && e.code === "invalid_argument") S.canWrite = false;
    toast(e && e.code === "quota_exceeded" ? "Storage is full for this demo." : "Couldn't save that. Check your connection and try again.");
    throw e;
  });
}
function setMine(col, field, value) {
  const map = { drinks: "drinks", cheers: "cheers", comments: "comments", memberships: "members", friends: "friends" }[col];
  S[map] = { ...S[map], [S.uid]: value };
  scheduleRender();
  return saveMine(col, field, value);
}

let toastTimer;
function toast(msg) { S.toast = msg; scheduleRender(); clearTimeout(toastTimer); toastTimer = setTimeout(() => { S.toast = ""; scheduleRender(); }, 4000); }

// ---------------------------------------------------------------- actions
async function addDrinks(entries) {
  const mine = [...(S.drinks[S.uid] || []), ...entries].sort((a, b) => a.at - b.at).slice(-MAX_DRINKS_PER_PERSON);
  return setMine("drinks", "items", mine);
}
function deleteDrink(id) {
  setMine("drinks", "items", (S.drinks[S.uid] || []).filter((d) => d.id !== id)).catch(() => {});
}
function toggleCheer(key) {
  const mine = new Set(S.cheers[S.uid] || []);
  mine.has(key) ? mine.delete(key) : mine.add(key);
  setMine("cheers", "keys", [...mine].slice(-2000)).catch(() => {});
}
function addComment(key, body) {
  const items = [...(S.comments[S.uid] || []), { id: rid(), k: key, body: body.slice(0, 500), at: Date.now() }].slice(-1000);
  setMine("comments", "items", items).catch(() => {});
}
function deleteComment(id) { setMine("comments", "items", (S.comments[S.uid] || []).filter((c) => c.id !== id)).catch(() => {}); }
function addFriend(uid) { if (uid !== S.uid && !myFriends().includes(uid)) setMine("friends", "uids", [...myFriends(), uid].slice(-500)).catch(() => {}); }
function removeFriend(uid) { setMine("friends", "uids", myFriends().filter((u) => u !== uid)).catch(() => {}); }
function joinGroup(gid) { if (!isMember(gid)) setMine("memberships", "groups", [...myGroups(), gid]).catch(() => {}); }
function leaveGroup(gid) { setMine("memberships", "groups", myGroups().filter((g) => g !== gid)).catch(() => {}); }
async function createGroup(name, kind) {
  const ref = db.collection("groups").doc();
  await ref.set({ name: name.slice(0, 60), kind, by: S.uid, at: Date.now() });
  joinGroup(ref.id);
  return ref.id;
}

// ---------------------------------------------------------------- routing
function route() {
  const h = location.hash.slice(1);
  S.route = ROUTES.includes(h) ? h : "feed";
  if (S.route === "person" && !S.person) S.route = "feed";
  if (S.route === "group" && !S.group) S.route = "groups";
  if (S.route === "log") S.log = freshLog();
  S.confirmDelete = null;
}
function go(r) { if (location.hash === "#" + r) { route(); render(); } else location.hash = r; window.scrollTo(0, 0); }
window.addEventListener("hashchange", () => { route(); render(); window.scrollTo(0, 0); });

// ---------------------------------------------------------------- render
let raf = 0;
function scheduleRender() { if (!raf) raf = requestAnimationFrame(() => { raf = 0; render(); }); }

function render() {
  document.getElementById("tabs").innerHTML = TABS.map(([r, l]) =>
    `<a class="tab ${S.route === r || (r === "groups" && S.route === "group") ? "on" : ""}" href="#${r}">${l}</a>`).join("");
  document.getElementById("logBtn").hidden = !S.canWrite || S.route === "log";
  const app = document.getElementById("app");
  // keep focus and typed text across re-renders
  const active = document.activeElement;
  const keep = active && active.id && app.contains(active) ? { id: active.id, start: active.selectionStart, end: active.selectionEnd } : null;
  const values = {};
  app.querySelectorAll("[data-keep]").forEach((el) => { values[el.id] = el.value; });

  app.innerHTML = view();

  for (const [id, v] of Object.entries(values)) { const el = document.getElementById(id); if (el && el.value !== v) el.value = v; }
  if (keep) { const el = document.getElementById(keep.id); if (el) { el.focus(); try { if (keep.start != null) el.setSelectionRange(keep.start, keep.end); } catch {} } }
}

function view() {
  if (S.status === "offline") return `<div class="card empty"><div class="big">🍻</div><p><b>Open this page on claude.ai</b></p><p class="muted small">The shared feed and leaderboards need the claude.ai viewer.</p></div>`;
  if (S.status === "nodb") return `<div class="card empty"><div class="big">🔒</div><p><b>Sign in to claude.ai to use drinks</b></p><p class="muted small">Your drinks are saved to your claude.ai account, so you need to be signed in to see the feed and log drinks.</p></div>`;
  let banner = "";
  if (S.status === "ready" && !S.canWrite) banner = `<div class="notice" style="margin-bottom:12px">You can look around, but logging is off for you. Ask the owner to share this page with you as a Contributor.</div>`;

  if (S.dbError) banner += `<div class="notice" style="margin-bottom:12px">Live updates stopped. Reload the page to reconnect.</div>`;

  if (p === "month") { d.setDate(1); return d.getTime(); }

}

// ---------- stats
function stats(rows) {
  const now = Date.now(), today = startOfDay(now);
  const sum = (since) => rows.filter((r) => r.at >= since).reduce((s, r) => s + r.std, 0);
  const byDay = new Map();
  for (const r of rows) { const k = dayKey(r.at); const v = byDay.get(k) || { std: 0, count: 0 }; v.std += r.std; v.count++; byDay.set(k, v); }
  const days = Array.from({ length: 30 }, (_, i) => { const t = startOfDay(today - (29 - i) * DAY + DAY / 2); return { t, ...(byDay.get(dayKey(t)) || { std: 0, count: 0 }) }; });
  const byType = {};
  for (const r of rows) { const v = (byType[r.type] ||= { std: 0, count: 0 }); v.std += r.std; v.count++; }
  const types = TYPES.filter((t) => byType[t.type]).map((t) => ({ ...t, ...byType[t.type] })).sort((a, b) => b.std - a.std);
  const total = rows.reduce((s, r) => s + r.std, 0);
  return { today: sum(today), week: sum(today - 6 * DAY), month: sum(today - 29 * DAY), total, count: rows.length, drinkingDays: byDay.size, days, types };
}
function statsView(rows, compact) {

    : [["Today", fmtStd(s.today), "std drinks"], ["Last 7 days", fmtStd(s.week), "std drinks"], ["Last 30 days", fmtStd(s.month), "std drinks"],
       ["All time", fmtStd(s.total), s.count + " drinks"], ["Drinking days", s.drinkingDays, "all time"], ["Per drinking day", fmtStd(s.drinkingDays ? s.total / s.drinkingDays : 0), "std drinks avg"]];
  const max = Math.max(1, Math.ceil(Math.max(...s.days.map((d) => d.std))));
  const fmtD = (t) => new Date(t).toLocaleDateString(undefined, { month: "short", day: "numeric" });
  const h = S.hover != null ? s.days[S.hover] : null;
  return `<div class="tiles ${compact ? "" : "six"}">${tiles.map(([l, v, sub]) => `<div class="card tile"><div class="muted tiny">${l}</div><div class="v">${v}</div><div class="muted tiny">${sub}</div></div>`).join("")}</div>
  <section class="card">
    <div class="row"><h2 class="grow">Standard drinks per day</h2><span class="muted tiny">last 30 days</span></div>
    <div class="small num" style="height:20px;margin-top:4px">${h ? `<b>${fmtD(h.t)}</b> <span class="muted">· ${fmtStd(h.std)} std drinks · ${h.count} ${h.count === 1 ? "drink" : "drinks"}</span>` : '<span class="muted">Tap or hover a bar for details</span>'}</div>
    <div class="chart">
      <div class="gridline" style="top:0"></div><div class="gridline" style="top:50%"></div><div class="gridline" style="bottom:0;border-top-style:solid"></div>
      <span class="tiny muted" style="position:absolute;right:0;top:-8px;background:var(--surface);padding-left:4px">${max}</span>
      <div class="bars">${s.days.map((d, i) => `<button class="barhit ${S.hover === i ? "on" : ""}" data-act="bar" data-i="${i}" aria-label="${fmtD(d.t)}: ${fmtStd(d.std)} standard drinks"><span style="height:${(d.std / max) * 100}%;${d.std > 0 ? "min-height:3px" : ""}"></span></button>`).join("")}</div>
    </div>
    <div class="row muted tiny" style="justify-content:space-between;margin-top:4px"><span>${fmtD(s.days[0].t)}</span><span>${fmtD(s.days[15].t)}</span><span>Today</span></div>
  </section>
  ${!compact && s.types.length ? `<section class="card stack" style="gap:8px"><h2>By type</h2><span class="muted tiny" style="margin-top:-6px">standard drinks, all time</span>
    ${s.types.map((t) => `<div class="typerow"><span class="trunc">${t.emoji} ${t.label}</span><div class="hbar-track"><div class="hbar" style="width:${(t.std / s.types[0].std) * 100}%" title="${t.count} drinks"></div></div><span class="num muted" style="text-align:right">${fmtStd(t.std)}</span></div>`).join("")}
  </section>` : ""}`;
}

          <div class="row"><input class="input" id="f-when" data-f="when" type="datetime-local" value="${esc(L.when || localInputNow())}">${L.when ? `<button type="button" class="btn sm" data-act="now">Now</button>` : ""}</div>
          <div class="muted tiny" style="margin-top:4px">${L.when ? "Using the time you picked." : "Uses the time you tap Log. Change it if you're logging later."}</div></div>
        ${groups.length ? `<div><label class="lbl" for="f-group">Group / event</label><select class="input" id="f-group" data-f="group"><option value="">None</option>${groups.map((g) => `<option value="${esc(g)}" ${L.group === g ? "selected" : ""}>${esc(S.groups[g].name)}</option>`).join("")}</select></div>` : ""}
        <div><label class="lbl" for="f-notes">Notes</label><textarea class="input" id="f-notes" data-f="notes" rows="2" maxlength="500" placeholder="Tasting notes, where you are, who's buying…">${esc(L.notes)}</textarea></div>
        <div><div class="lbl">Photo</div>${L.photoUrl ? `<div class="row" style="align-items:flex-start"><img src="${L.photoUrl}" alt="" style="max-height:160px;border-radius:12px"><button type="button" class="btn sm" data-act="nophoto">Remove</button></div>` : `<input type="file" accept="image/*" id="photoFile" class="small">`}
          ${L.photo && !assets ? `<div class="muted tiny" style="margin-top:4px">Photos can't be saved in this view.</div>` : ""}</div>
      </div>
    </details>
    ${L.error ? `<div class="err">${esc(L.error)}</div>` : ""}
    <button class="btn primary big" ${L.saving || L.scanning ? "disabled" : ""}>${L.saving ? "Saving…" : L.qty > 1 ? `Log ${L.qty} drinks 🍻` : "Log it 🍻"}</button>
  </form>`;
}

async function compress(file) {
  try {
    const bmp = await createImageBitmap(file);
    const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    const blob = await new Promise((r) => c.toBlob(r, "image/jpeg", 0.85));
    return blob || file;
  } catch { return file; }
}
function setPhoto(blob) {
  const L = S.log;
  if (L.photoUrl) URL.revokeObjectURL(L.photoUrl);
  L.photo = blob; L.photoUrl = blob ? URL.createObjectURL(blob) : null;
}

const SCAN_PROMPT = `You read drinks for a drink-logging app. Reply with ONLY a JSON object, no other text:
{"drinks":[{"drink_type":"beer","name":"Modelo Especial","volume_ml":355,"abv":4.4,"quantity":1,"read_from_label":true}],"message":"Found 1 Modelo Especial."}

Rules:
- drink_type is one of: beer, wine, cocktail, shot (straight spirit, ~44 ml), spirit (mixed drink like a vodka soda), cider, seltzer (hard seltzer), other.
- Read brand, product, volume and ABV from the label when visible. "12 FL OZ" = 355 ml, "16 FL OZ" = 473 ml, "24 FL OZ" = 710 ml.
- If something is not visible or stated, use the well-known values for that product (Modelo Especial: 4.4%, 355 ml can) and set read_from_label to false. Unknown product: typical values for its type.
- volume_ml is ONE unit. quantity counts identical units in the photo, or the number in the message ("3 modelos" -> 3). Default 1.
- Group identical drinks into one entry; list different drinks separately (at most 5).
- Non-alcoholic drinks or anything that isn't a drink: return "drinks": [] and say so in message.
- message: one short friendly sentence, under 15 words. Don't comment on how much someone drinks.`;

async function runScan({ image, text }) {
  const L = S.log;
  L.error = ""; L.scan = null; L.scanning = true; render();
  try {
    const prompt = SCAN_PROMPT + "\n\n" + (text ? `The user typed the drink's name: """${text.slice(0, 200)}"""` : "The attached photo shows what they're drinking.");
    const opts = { modelTier: "quick" };
    if (image) opts.images = [image];
    const raw = await sample.json(prompt, opts);
    const list = Array.isArray(raw?.drinks) ? raw.drinks : [];
    const drinks = list.slice(0, 5).map((d) => ({
      drink_type: TYPES.some((t) => t.type === d?.drink_type) ? d.drink_type : "other",
      name: String(d?.name ?? "").slice(0, 80),
      volume_ml: Math.min(5000, Math.max(1, Number(d?.volume_ml) || 355)),
      abv: Math.min(100, Math.max(0, Number(d?.abv) || 0)),
      quantity: Math.min(30, Math.max(1, Math.round(Number(d?.quantity) || 1))),
      read_from_label: !!d?.read_from_label,
    }));
    L.scan = { drinks, message: String(raw?.message || (drinks.length ? "Filled in below." : "Couldn't spot a drink there.")).slice(0, 160) };
    if (drinks.length) applyScanned(0);
  } catch (e) {
    const msg = {
      not_granted: "Scanning needs your OK to use Claude. Fill in the form instead.",
      rate_limited: "Too many scans right now. Try again in a minute.",
      image_rejected: "That photo didn't work. Try a different one.",
      images_unavailable: "Photo scanning isn't available here. Type it instead.",
      invalid_json: "Couldn't read that one. Try again or type it in.",
      refused: "Couldn't read that one. Try another photo or type it in.",
      cancelled: "",
    }[e?.code];
    L.error = msg ?? "Scan didn't work. Try again or fill it in by hand.";
  } finally { L.scanning = false; render(); }
}
function applyScanned(i) {
  const L = S.log, d = L.scan.drinks[i];
  L.picked = i; L.type = d.drink_type; L.name = d.name || L.name;
  L.ml = String(Math.round(d.volume_ml * 10) / 10); L.abv = String(Math.round(d.abv * 10) / 10); L.qty = d.quantity;
}

async function submitLog() {
  const L = S.log;
  const ml = Number(L.ml), abv = Number(L.abv), at = L.when ? new Date(L.when).getTime() : Date.now();
  if (!(ml > 0 && ml <= 5000)) { L.error = "Size must be between 1 and 5000 ml."; L.open = true; return render(); }
  if (!(abv >= 0 && abv <= 100)) { L.error = "ABV must be between 0 and 100%."; L.open = true; return render(); }
  if (!Number.isFinite(at)) { L.error = "Pick a valid time."; return render(); }
  L.saving = true; L.error = ""; render();
  let photo = null;
  if (L.photo && assets) {
    try { photo = (await assets.upload(L.photo)).id; } catch { toast("The photo couldn't be saved, so the drink was logged without it."); }
  }
  const base = { type: L.type, name: L.name.trim().slice(0, 80), ml, abv, std: stdOf(ml, abv), at, group: L.group || null };
  const entries = Array.from({ length: L.qty }, (_, i) => ({ ...base, id: rid(), notes: i === 0 ? L.notes.trim().slice(0, 500) : "", photo: i === 0 ? photo : null }));
  try {
    const p = addDrinks(entries);
    toast(L.qty > 1 ? `Logged ${L.qty} drinks 🍻` : "Logged 🍻");
    if (base.group) S.group = base.group;
    go(base.group ? "group" : "feed");
    await p;
  } catch { /* toast already shown */ }
}

// ---------------------------------------------------------------- events
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act, L = S.log;
  if (["type", "size", "qty", "pick", "lookup", "now", "nophoto"].includes(a)) e.preventDefault();
  switch (a) {
    case "person": S.person = el.dataset.uid; go("person"); return;
    case "group": S.group = el.dataset.gid; go("group"); return;
    case "more": S.feedLimit += 30; break;
    case "period": S.period = el.dataset.p; break;
    case "cheer": toggleCheer(el.dataset.key); return;
    case "comments": { const k = el.dataset.key; S.openComments.has(k) ? S.openComments.delete(k) : S.openComments.add(k); break; }
    case "uncomment": deleteComment(el.dataset.id); return;
    case "del": S.confirmDelete = el.dataset.key; setTimeout(() => { if (S.confirmDelete === el.dataset.key) { S.confirmDelete = null; scheduleRender(); } }, 4000); break;
    case "del-yes": S.confirmDelete = null; deleteDrink(el.dataset.id); return;
    case "del-no": S.confirmDelete = null; break;
    case "join": joinGroup(el.dataset.gid); return;
    case "leave": leaveGroup(el.dataset.gid); return;
    case "bar": S.hover = Number(el.dataset.i); break;
    case "type": { const m = meta(el.dataset.t); L.type = m.type; L.ml = String(m.ml); L.abv = String(m.abv); break; }
    case "size": L.ml = el.dataset.ml; break;
    case "qty": L.qty = Math.min(30, Math.max(1, L.qty + Number(el.dataset.d))); break;
    case "pick": applyScanned(Number(el.dataset.i)); break;
    case "lookup": if (L.name.trim()) runScan({ text: L.name.trim() }); else { L.error = "Type what you're drinking first, like \"Modelo\"."; } break;
    case "now": L.when = ""; break;
    case "scope": S.boardScope = el.dataset.s; break;
    case "btype": S.boardType = el.dataset.t; break;
    case "friend": addFriend(el.dataset.uid); return;
    case "unfriend": removeFriend(el.dataset.uid); return;
    case "nophoto": setPhoto(null); break;
  }
  render();
});
document.addEventListener("mouseover", (e) => {
  const el = e.target.closest(".barhit"); if (el && S.hover !== Number(el.dataset.i)) { S.hover = Number(el.dataset.i); render(); }
});
document.addEventListener("input", (e) => {
  const el = e.target, L = S.log;
  if (L && el.dataset.f) {
    L[el.dataset.f] = el.value;
    if (el.dataset.f === "ml" || el.dataset.f === "abv") { const o = document.getElementById("stdOut"); if (o) o.textContent = fmtStd(stdOf(Number(L.ml) || 0, Number(L.abv) || 0) * L.qty); }
    const sum = document.getElementById("sumLine"); if (sum) sum.textContent = summaryLine();
    if (el.dataset.f === "name") {
      // Picking one of your past drinks fills in its type, size and ABV.
      const v = el.value.trim().toLowerCase();
      const hit = v && recentDrinks().find((d) => d.name.trim().toLowerCase() === v);
      if (hit) { L.type = hit.type; L.ml = String(hit.ml); L.abv = String(hit.abv); render(); }
    }
  }
  if (el.name === "kind") el.closest("form").querySelectorAll("label.tab").forEach((lb) => lb.classList.toggle("on", lb.contains(el)));
});
document.addEventListener("change", async (e) => {
  const el = e.target;
  if (el.dataset.f === "group" && S.log) { S.log.group = el.value; const sum = document.getElementById("sumLine"); if (sum) sum.textContent = summaryLine(); }
  if (el.id === "scanFile" && el.files[0]) { const small = await compress(el.files[0]); setPhoto(small); runScan({ image: small }); }
  if (el.id === "photoFile" && el.files[0]) { setPhoto(await compress(el.files[0])); render(); }
});
document.addEventListener("toggle", (e) => { if (e.target.id === "more" && S.log) S.log.open = e.target.open; }, true);
document.addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = e.target, kind = f.dataset.form;
  if (kind === "log") submitLog();
  if (kind === "comment") { const inp = f.elements.body; const body = inp.value.trim(); if (body) { addComment(f.dataset.key, body); inp.value = ""; render(); } }
  if (kind === "group") {
    const name = f.elements.name.value.trim(); if (!name) return;
    const btn = f.querySelector("button"); btn.disabled = true;
    try { const id = await createGroup(name, f.elements.kind.value); f.elements.name.value = ""; S.group = id; go("group"); }
    catch { toast("Couldn't create the group. Try again."); btn.disabled = false; }
  }
});

render();
boot();
</script>
